basePath: /api/v1
definitions:
  domain.Amount:
    properties:
      currency:
        allOf:
        - $ref: '#/definitions/finance.Currency'
        description: Currency is the currency this value is denominated in.
      value:
        description: Value is the monetary value in Currency.
        type: number
    type: object
  domain.Holding:
    properties:
      created_at:
        type: string
      currency:
        $ref: '#/definitions/finance.Currency'
      current_price:
        allOf:
        - $ref: '#/definitions/finance.ListingPrice'
        description: |-
          CurrentPrice is the price the market value is based on, including its
          currency and provenance.
      entry_date:
        type: string
      entry_price:
        type: number
      entry_value:
        allOf:
        - $ref: '#/definitions/domain.Amount'
        description: EntryValue is quantity x entry price, denominated in the position
          currency.
      id:
        type: string
      listing:
        $ref: '#/definitions/finance.Listing'
      market_value:
        allOf:
        - $ref: '#/definitions/domain.Amount'
        description: MarketValue is quantity x current price, denominated in the price
          currency.
      notes:
        type: string
      pnl:
        allOf:
        - $ref: '#/definitions/domain.Amount'
        description: PnL is only set when EntryValue and MarketValue share a currency.
      pnl_percent:
        description: PnLPercent is only set when PnL is set.
        type: number
      quantity:
        type: number
      updated_at:
        type: string
    type: object
  domain.Portfolio:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      positions:
        items:
          $ref: '#/definitions/domain.Position'
        type: array
      updated_at:
        type: string
    type: object
  domain.Position:
    properties:
      created_at:
        type: string
      currency:
        $ref: '#/definitions/finance.Currency'
      entry_date:
        type: string
      entry_price:
        type: number
      id:
        type: string
      listing:
        $ref: '#/definitions/finance.Listing'
      notes:
        type: string
      quantity:
        type: number
      updated_at:
        type: string
    type: object
  domain.PriceHistory:
    properties:
      listing:
        $ref: '#/definitions/finance.Listing'
      quotes:
        items:
          $ref: '#/definitions/domain.Quote'
        type: array
    type: object
  domain.Quote:
    properties:
      close:
        description: Close gives the close price of the day before the trading day
          identified by Timestamp.
        type: number
      currency:
        allOf:
        - $ref: '#/definitions/finance.Currency'
        description: Currency gives the currency for the given values.
      high:
        description: High gives the high price at the trading day identified by Timestamp.
        type: number
      listing:
        allOf:
        - $ref: '#/definitions/finance.Listing'
        description: Instrument the financial instrument this price is for.
      low:
        description: Low gives the low price at the trading day identified by Timestamp.
        type: number
      open:
        description: Open gives the open price at the trading day identified by Timestamp.
        type: number
      price:
        description: Price gives the current price at the trading day identified by
          Timestamp.
        type: number
      source:
        description: |-
          Sources defines the provider this price has been
          queried from.
        type: string
      source_timestamp:
        description: |-
          SourceTimestamp defines the time this price has
          been queried.
        type: string
      timestamp:
        description: |-
          Timestamp gives the point in time this price was current
          according to the sourcing provider.
        type: string
      volume:
        description: Volume gives the order volume at the trading day identified by
          Timestamp.
        type: integer
    type: object
