host: localhost:9123
info:
  contact:
    url: https://github.com/tdrn-org/adjudex-mcp
  description: MCP server providing Agent access to virtual stock depot.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: ADJUDEX MCP Server REST API
  version: "1.0"
paths:
  /api/v1/info:
    get:
      description: Get server software version details.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rest.serverInfo'
        "500":
          description: server error
          schema:
            type: string
      summary: Query server info
  /api/v1/ping:
    get:
      description: Ping the server to check general health
      produces:
      - text/plain
      responses:
        "200":
          description: ok
          schema:
            type: string
        "500":
          description: server error
          schema:
            type: string
      summary: Ping the server
  /api/v1/portfolios:
    get:
      description: Returns all portfolios without positions for performance.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Portfolio'
            type: array
        "500":
          description: server error
          schema:
            type: string
      summary: List all portfolios
    post:
      consumes:
      - application/json
      description: Creates a portfolio and returns it with its ID.
      parameters:
      - description: Portfolio data
        in: body
        name: portfolio
        required: true
        schema:
          $ref: '#/definitions/rest.portfolioCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Portfolio'
        "400":
          description: bad request
          schema:
            type: string
      summary: Create a new portfolio
  /api/v1/portfolios/{id}:
    delete:
      description: Deletes a portfolio and all its positions.
      parameters:
      - description: Portfolio ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            type: string
      summary: Delete a portfolio
    get:
      description: Returns a single portfolio with all positions.
      parameters:
      - description: Portfolio ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Portfolio'
        "404":
          description: not found
          schema:
            type: string
      summary: Get portfolio by ID
  /api/v1/portfolios/{id}/holdings:
    get:
      description: Returns the portfolio with all positions enriched with current
        market data.
      parameters:
      - description: Portfolio ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Holding'
            type: array
        "404":
          description: not found
          schema:
            type: string
      summary: Get portfolio holdings with live PnL
  /api/v1/portfolios/{id}/positions:
    post:
      consumes:
      - application/json
      description: Adds a new position and returns it with its ID.
      parameters:
      - description: Portfolio ID
        in: path
        name: id
        required: true
        type: string
      - description: Position data
        in: body
        name: position
        required: true
        schema:
          $ref: '#/definitions/rest.positionAddRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Position'
        "400":
          description: bad request
          schema:
            type: string
      summary: Add a position to a portfolio
  /api/v1/portfolios/{id}/positions/{posId}:
    delete:
      description: Removes a position from a portfolio.
      parameters:
      - description: Portfolio ID
        in: path
        name: id
        required: true
        type: string
      - description: Position ID
        in: path
        name: posId
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: not found
          schema:
            type: string
      summary: Remove a position
    put:
      consumes:
      - application/json
      description: Updates an existing position. Only provided fields are changed
        (PATCH semantics).
      parameters:
      - description: Portfolio ID
        in: path
        name: id
        required: true
        type: string
      - description: Position ID
        in: path
        name: posId
        required: true
        type: string
      - description: Position updates
        in: body
        name: position
        required: true
        schema:
          $ref: '#/definitions/rest.positionUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Position'
        "400":
          description: bad request
          schema:
            type: string
      summary: Update a position
  /api/v1/quotes/{listing}:
    get:
      description: Returns the latest quote for a symbol (cached or live).
      parameters:
      - description: Listing
        in: path
        name: listing
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Quote'
        "404":
          description: not found
          schema:
            type: string
      summary: Get latest quote
  /api/v1/quotes/{listing}/history:
    get:
      description: Returns historical quotes for a symbol within a date range.
      parameters:
      - description: Listing
        in: path
        name: listing
        required: true
        type: string
      - description: Start date (RFC3339)
        in: query
        name: from
        type: string
      - description: End date (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PriceHistory'
        "404":
          description: not found
          schema:
            type: string
      summary: Get quote history
  /api/v1/rates:
    get:
      description: Returns the exchange rates converting the given base currencies
        into the target currency. Quotes are always delivered in the currency their
        provider reports; clients use these rates to present them in their own currency.
      parameters:
      - description: Target currency (e.g. EUR). Defaults to the configured display
          currency.
        in: query
        name: target
        type: string
      - collectionFormat: csv
        description: Base currencies to convert from (repeatable, e.g. ?base=USD&base=CHF).
        in: query
        items:
          type: string
        name: base
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/finance.ExchangeRate'
            type: array
        "503":
          description: rate not available
          schema:
            type: string
      summary: Exchange rates
swagger: "2.0"
