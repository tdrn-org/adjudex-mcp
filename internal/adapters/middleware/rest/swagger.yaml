  finance.ExchangeRate:
    properties:
      base:
        allOf:
        - $ref: '#/definitions/finance.Currency'
        description: Base defines the base currency for this exchange rate.
      quote:
        allOf:
        - $ref: '#/definitions/finance.Currency'
        description: Quote defines the quoted currency for this exchange rate.
      rate:
        description: Rate defines the rate for base to quoted currency.
        type: number
      source:
        description: |-
          Sources defines the provider this exchange rate has been
          queried from.
        type: string
      source_timestamp:
        description: |-
          SourceTimestamp defines the time this exchange rate has
          been queried.
        type: string
      timestamp:
        description: |-
          Timestamp defines the point in time this exchange rate
          was current according to the provider.
