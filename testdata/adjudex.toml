[logging]
level = "info"
target = "stdout"
color = "auto"
file_name = "./adjudex.log"
file_size_limit = 0
syslog_network = "tcp"
syslog_address = "localhost:601"
syslog_encoding = "rfc5424"
syslog_facility = 4

[server]
address = "localhost:0"
protocol = "http"
cert_file = ""
key_file = ""
public_url = ""
trusted_proxies = [ ]
trusted_headers = [ ]
allowed_origins = [ ]
access_log = ""
access_log_size_limit = 0
session_cookie_name = "adjudex-session"

[store]
type = "memory"

[store.memory]

[store.sqlite]
file = "./adjudex.db"

[provider.fx]

[[provider.fx.provider]]
name = "frankfurter"
cooldown_ttl = "15m"
cache_ttl = "2h"

[[provider.fx.provider]]
name = "alphavantage"
cooldown_ttl = "15m"
cache_ttl = "3h"

[[provider.fx.provider]]
name = "consorsbank"
cooldown_ttl = "15m"
cache_ttl = "4h"

[[provider.fx.provider]]
name = "twelvedata"
cooldown_ttl = "15m"
cache_ttl = "5h"

[provider.listings]

[[provider.listings.provider]]
name = "alphavantage"
cooldown_ttl = "15m"
listing_cache_ttl = "4h"
quote_cache_ttl = "3h"

[[provider.listings.provider]]
name = "consorsbank"
cooldown_ttl = "15m"
listing_cache_ttl = "5h"
quote_cache_ttl = "2h"

[[provider.listings.provider]]
name = "twelvedata"
cooldown_ttl = "15m"
listing_cache_ttl = "6h"
quote_cache_ttl = "1h"

[provider.alphavantage]
base_url = "https://www.alphavantage.co/query/"
api_key = ""

[provider.consorsbank]
address = "localhost:40443"
skip_verify = true
ca_file = "root.pem"
secret = ""
preferred_currency = ""
subscription_timeout = "1h"

[provider.frankfurter]
base_url = "https://api.frankfurter.dev/v2/"

[provider.twelvedata]
api_key = ""

[provider.cache]
type = "memory"

[provider.cache.memory]

[provider.cache.redis]
address = "localhost:6379"
password = ""
db = 0

[tracing]
enabled = true
protocol = "http"
endpoint_url = "https://localhost:4317"
batch_timeout = "10s"
export_timeout = "60s"

[tracing.headers]
X-Scope-OrgID = "tenant-id"
