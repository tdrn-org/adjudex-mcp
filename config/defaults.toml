[logging]
level = "info"
target = "stdout"
color = "auto"
file_name = "./adjudex.log"
file_size_limit = 0
syslog_network = "unixgram"
syslog_address = "/dev/log"
syslog_encoding = "local"
syslog_facility = 4

[server]
address = "localhost:0"
protocol = "http"
cert_file = ""
key_file = ""
public_url = ""
trusted_proxies = [ ]
trusted_headers = [ ]
allowed_origins = [ ]
access_log = ""
access_log_size_limit = 0
session_cookie_name = "adjudex-session"

[store]
type = "memory"

[store.memory]

[store.sqlite]
file = "./adjudex.db"

# Preferred presentation currency of the user interface. Requests without an
# explicit currency fall back to this value; it never changes how a value is
# denominated at its source.
[display]
currency = "EUR"

[provider.fx]
cooldown = "10m"

[[provider.fx.provider]]
name = "demo"
cache_ttl = "1h"

[provider.listings]
cooldown = "10m"

[[provider.listings.provider]]
name = "demo"
listing_cache_ttl = "12h"
quote_cache_ttl = "5m"

[provider.demo]
enabled = true

[provider.alphavantage]
base_url = "https://www.alphavantage.co/query/"
api_key = ""

[provider.consorsbank]
address = "localhost:40443"
skip_verify = false
ca_file = "root.pem"
secret = ""
include_exchanges = []
preferred_currency = ""
subscription_timeout = "1h"

[provider.frankfurter]
base_url = "https://api.frankfurter.dev/v2/"

[provider.openfigi]
base_url = "https://api.openfigi.com/v3"
api_key = ""

[provider.twelvedata]
api_key = ""
include_mics = []
include_instrument_types = []

[provider.cache]
type = "memory"

[provider.cache.memory]

[provider.cache.redis]
address = "localhost:6379"
password = ""
db = 0

[metrics]
enabled = false
path = "/metrics"

[tracing]
enabled = false
protocol = "gRPC"
endpoint_url = "http://localhost:4317"
batch_timeout = "5s"
export_timeout = "30s"

[tracing.headers]
#X-Scope-OrgID = ""
