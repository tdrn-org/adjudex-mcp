[logging]
level = "info"
target = "stdout"
color = "auto"
file_name = "./adjudex.log"
file_size_limit = 0
syslog_network = "tcp"
syslog_address = "localhost:601"
syslog_encoding = "rfc5424"
syslog_facility = 4

[server]
address = "localhost:0"
protocol = "http"
cert_file = ""
key_file = ""
public_url = ""
trusted_proxies = [ ]
trusted_headers = [ ]
allowed_origins = [ ]
access_log = ""
access_log_size_limit = 0
session_cookie_name = "adjudex-session"

[store]
type = "memory"

[store.memory]

[store.sqlite]
file = "./adjudex.db"

[quote_service]
currency = "USD"

[quote_service.demo]
enabled = false
online = true

[quote_service.alphavantage]
enabled = false
online = false
api_key = ""

[quote_service.twelvedata]
enabled = false
online = true
api_key = ""
